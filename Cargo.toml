[workspace]
members = [
  "apps/newpic/src-tauri",
  "crates/newpic-core",
  "crates/newpic-platform",
  "crates/newpic-windows",
  "crates/newpic-macos",
  "crates/newpic-linux",
  "crates/newpic-testing",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
arboard = "=3.7.0"
directories = "=6.0.0"
fs2 = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
screencapturekit = { version = "=11.0.0", default-features = false, features = ["macos_13_0"] }
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-notification = "=2.7.0"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
xcap = "=0.9.8"
windows = "=0.62.2"
