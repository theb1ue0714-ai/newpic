name: Unsigned development installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }} unsigned development build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,appimage
            artifacts: |
              target/release/bundle/deb/**/*
              target/release/bundle/appimage/**/*
          - name: Windows
            os: windows-2025
            bundles: msi,nsis
            artifacts: |
              target/release/bundle/msi/**/*
              target/release/bundle/nsis/**/*
          - name: macOS
            os: macos-15
            bundles: app,dmg
            artifacts: |
              target/release/bundle/macos/**/*
              target/release/bundle/dmg/**/*
          - name: macOS-Intel
            os: macos-15-intel
            bundles: app,dmg
            artifacts: |
              target/release/bundle/macos/**/*
              target/release/bundle/dmg/**/*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libdbus-1-dev libgbm-dev
      - name: Select Xcode 26 SDK
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build unsigned development bundles
        run: npm run tauri --workspace=@newpic/desktop -- build --bundles ${{ matrix.bundles }} --ci --no-sign
      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/assert-windows-gui-subsystem.ps1 ./target/release/newpic-desktop.exe
      - name: Upload unsigned development artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NewPic-${{ matrix.name }}-unsigned-development
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish unsigned development release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Flatten and normalize installer names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          VERSION="${GITHUB_REF_NAME#v}"
          find release-artifacts/NewPic-Windows-unsigned-development -type f -name '*.exe' -exec cp '{}' "release-files/NewPic-${VERSION}-x64-setup.exe" \;
          find release-artifacts/NewPic-Windows-unsigned-development -type f -name '*.msi' -exec cp '{}' "release-files/NewPic-${VERSION}-x64.msi" \;
          find release-artifacts/NewPic-macOS-unsigned-development -type f -name '*.dmg' -exec cp '{}' "release-files/NewPic-${VERSION}-Apple-Silicon.dmg" \;
          find release-artifacts/NewPic-macOS-Intel-unsigned-development -type f -name '*.dmg' -exec cp '{}' "release-files/NewPic-${VERSION}-Intel.dmg" \;
          find release-artifacts/NewPic-Linux-unsigned-development -type f -name '*.AppImage' -exec cp '{}' "release-files/NewPic-${VERSION}-x86_64.AppImage" \;
          find release-artifacts/NewPic-Linux-unsigned-development -type f -name '*.deb' -exec cp '{}' "release-files/NewPic-${VERSION}-amd64.deb" \;
          test "$(find release-files -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum release-files/* > release-files/SHA256SUMS.txt
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          name: NewPic ${{ github.ref_name }} unsigned development build
          prerelease: true
          generate_release_notes: true
          files: release-files/*
