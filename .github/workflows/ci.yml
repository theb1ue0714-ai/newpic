name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }} verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2025
          - name: macOS
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libdbus-1-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Generate original bundle icons
        run: npm run prepare-icons --workspace=@newpic/desktop
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build --workspace=@newpic/desktop
      - name: Tauri application build check
        run: npm run tauri --workspace=@newpic/desktop -- build --no-bundle --ci
      - run: bash scripts/verify-default-preset.sh
        shell: bash
      - name: Audit npm production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust-policy:
    name: Rust advisories and licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
